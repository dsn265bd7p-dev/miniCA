name: miniCA
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: de
  createIntermediateGroups: true

packages:
  swift-certificates:
    url: https://github.com/apple/swift-certificates
    from: 1.0.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    from: 3.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "1.0.0"

targets:
  miniCA:
    type: application
    platform: macOS
    sources:
      - miniCA
    dependencies:
      - package: swift-certificates
        product: X509
      - package: swift-crypto
        product: Crypto
      - package: swift-crypto
        product: _CryptoExtras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.miniCA
        INFOPLIST_KEY_CFBundleDisplayName: miniCA
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
